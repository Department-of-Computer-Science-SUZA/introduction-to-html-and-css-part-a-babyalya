<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIST</title>
</head>
<body>
    <h2>To illustrate Nested and Definition List Tags</h2>
    
    <h3>An ordered nested List:</h3>
    <ol>
        <li>Coffee</li>
        <li>Tea
            <ol type="a">
                <li>Black tea</li>
                <li>Green tea
                    <ol type="i">
                        <li>China</li>
                        <li>Africa</li>
                    </ol>
                </li>
            </ol>
        </li>
        <li>Milk</li>
    </ol>
    <h3>A Definition List:</h3>
    <dl>
        <dt>Bangalore</dt>
        <dd>- Capital City of Karnataka</dd>
        <dt>Mumbai</dt>
        <dd>- Capital city of Maharashtra</dd>
    </dl>
</body>
</html>
