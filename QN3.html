<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Credit Number Validtion</title>
    <style>
        body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 20px 0 10px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

   

    #result {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }

    .valid {
      color: green;
    }

    .invalid {
      color: red;
    }
    </style>
</head>
<body>
    <div class="container">
    <h2>Credit Card Validator</h2>

    <label for="cardNumber">Enter Card Number:</label>
    <input type="text" id="cardNumber" placeholder="e.g. 4111111111111">

    <button onclick="validateCreditCard()">Validate</button>

    <div id="result"></div>
  </div>

  <script>
    function validateCreditCard() {
      const cardNumber = document.getElementById("cardNumber").value.trim();
      const result = document.getElementById("result");

      // Regular expressions
      const amexRegex = /^3[47][0-9]{13}$/;
      const masterRegex = /^5[1-5][0-9]{14}$/;
      const visaRegex = /^4([0-9]{12}|[0-9]{15})$/;
      const discoverRegex = /^6011([0-9]{11}|[0-9]{12})$/;
      const dinersRegex = /^30[0-5][0-9]{11}$/;

      // Check card type
      if (amexRegex.test(cardNumber)) {
        result.textContent = "✅ Valid American Express Card";
        result.className = "valid";
      } else if (masterRegex.test(cardNumber)) {
        result.textContent = "✅ Valid MasterCard";
        result.className = "valid";
      } else if (visaRegex.test(cardNumber)) {
        result.textContent = "✅ Valid VISA Card";
        result.className = "valid";
      } else if (discoverRegex.test(cardNumber)) {
        result.textContent = "✅ Valid Discover Card";
        result.className = "valid";
      } else if (dinersRegex.test(cardNumber)) {
        result.textContent = "✅ Valid Diners Club Card";
        result.className = "valid";
      } else {
        result.textContent = "❌ Invalid credit card number";
        result.className = "invalid";
      }
    }
  </script>
</body>
</html>
