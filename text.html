<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
    <style>
        body{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>To illustrate text formatting tags</h1>
    <marquee>This is an alternate Marquee text</marquee>
    <p><i>This is italicized</i></p>
    <p>This is <u>underlined</u></p>
    <p><b>This is bold</b></p>
    <p><em>This is emphasized</em></p>
    <p><strong>This is Strong Text</strong></p>
    <p><s>This is strikethrough</s></p>
    <p><code>This is computer code</code></p>
    <p>This is <sup>superscript</sup> code</p>
    <p>This is <sub>subscript</sub> code</p>
    <p><big>This is big text</big></p>
    <p><small>This is small text</small></p>
</body>
</html>
